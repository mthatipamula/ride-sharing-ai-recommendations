[project]
name = "rideshare-recs"
version = "0.1.0"
description = "Rider recommendations: two-tower retrieval, learning-to-rank and ride-mode conversion models"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "torch>=2.5",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "prometheus-client>=0.21",
    "httpx>=0.28",
]

[project.scripts]
rideshare-train = "rideshare_recs.train:main"
rideshare-publish-features = "rideshare_recs.serving.publish:main"
rideshare-abtest = "rideshare_recs.ab_test:main"
rideshare-bench = "rideshare_recs.serving.bench:main"
rideshare-replay = "rideshare_recs.serving.replay:main"
rideshare-drift = "rideshare_recs.drift:main"

[dependency-groups]
dev = ["pytest>=8"]

# CPU-only PyTorch wheels on Linux (Docker): the default Linux wheel bundles CUDA and is several GB
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rideshare_recs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
