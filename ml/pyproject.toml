[project]
name = "rideshare-recs"
version = "0.1.0"
description = "Rider recommendations: two-tower retrieval, learning-to-rank and ride-mode conversion models"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "torch>=2.5",
    "scikit-learn>=1.5",
]

[project.scripts]
rideshare-train = "rideshare_recs.train:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rideshare_recs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
